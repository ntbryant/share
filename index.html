<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared by Nick Turman-Bryant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#f3f6f9;--ink:#0f1c2b;--muted:#4f5f71;--line:#d3dbe4;--card:#fff;--accent:#123a63}
@media (prefers-color-scheme: dark){:root{--bg:#0b1420;--ink:#e7eef6;--muted:#9db0c4;--line:#24384d;--card:#12202f;--accent:#8cc0f5;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:64px max(16px,env(safe-area-inset-left,0px)) 80px}
h1{font:800 clamp(2.4rem,7vw,3.6rem)/1 "Big Shoulders Display","Arial Narrow",sans-serif;text-transform:uppercase;margin:0 0 12px}
p{color:var(--muted);margin:0 0 32px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent)}
a.card b{display:block;font-size:1.15rem}
a.card span{color:var(--muted);font-size:.95rem}
footer{margin-top:40px;font-size:.9rem}
footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Things worth sharing</h1>
  <p>Short guides on things I've looked into.</p>
  <ul>
    <li><a class="card" href="mile/start"><b>Your first faster mile</b><span>A simple 3-runs-a-week plan to a faster mile by race day.</span></a></li>
    <li><a class="card" href="mile/"><b>Road to a 7:00 mile</b><span>The science, exact training paces and workouts behind the plan.</span></a></li>
  </ul>
  <footer><a href="https://nickturmanbryant.com">nickturmanbryant.com</a></footer>
</main>
</body>
</html>
